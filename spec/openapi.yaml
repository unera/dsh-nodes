# Client protocol of dsh-nodes.
#
# Everything a new client needs — Android, Go, anything — to talk to a DSH
# server: register the node, announce its APIs, keep presence, fetch commands and
# report results.
#
# Deliberately absent:
#  - the admin API under /api/dsh-nodes/* — private, behind the DSH session;
#  - the contract of node-side plugins (shell, job, session) — the server only
#    knows what a node announced in `announce`, and that is the point.
openapi: 3.1.0

info:
  title: dsh-nodes client API
  version: "1"
  description: |
    How a node talks to a DSH server.

    Four behaviours deserve attention because a client that gets them wrong will
    look like it works and then quietly lose commands.

    **A command is handed out once.** `GET /v1/commands` takes a batch from the
    head of the queue and moves it to `processing`. There is no lease and no
    redelivery: taken means either executed or attempted. A node that dies mid
    command leaves it `processing`; the server closes it as `lost` after the
    timeout so the model gets an answer instead of silence.

    **Approval is a control command.** When the sandbox denies a command, the
    server queues `#INTERNAL.APPROVE` on the node — an internal command, not a
    method of any announced API — and returns the denial to the model at once;
    nothing waits for the human. The question lives as long as
    `approvalTtlSeconds` (a day by default) and can be cancelled at any time with
    `#INTERNAL.CANCEL`.

    **`approver: "local"` is a promise.** A node announcing it must implement
    `#INTERNAL.APPROVE`. Nothing is checked at announce time: a node that did not
    implement it answers `unknown_method`, and that is an honest refusal.

    **The generation is the identity.** Two counters decide who is talking to
    whom. `epoch` is the server's own: it changes on every server restart, and a
    client that names another one is refused instead of being served commands
    from a life it does not belong to. `client_epoch` is the client's own: it
    grows on every connection, so an older instance of a node is recognised even
    after the server restarted. Only `announce` with `epoch: null` — "I lost my
    state" — closes in-flight commands; a socket that comes and goes never does.

servers:
  - url: https://dsh.example.com/dsh-nodes
    description: prefix configured on the plugin; it can be any path

tags:
  - name: enroll
    description: how a node gets onto the server
  - name: node
    description: presence, API announcement, command delivery
  - name: presence
    description: WebSocket used only for cheap wake-ups


# WebSocket frames. The list is machine-readable: a test compares it with the code so
# the schema cannot lag behind the implementation.
x-ws-frames:
  - state
  - ping
  - pong

# Методы, которые объявляют клиентские API. Список сверяется тестом с
# описаниями в репозитории клиента: так schema догоняет код сразу, а не через
# неделю.
x-client-methods:
  files:
    - roots
    - list
    - stat
    - read
    - write
    - edit
    - mkdir
    - sha256
    - copyToDevice
    - copyFromDevice
  notifications:
    - post
  session:
    - ping
    - version
    - id
    - cwd
    - chdir
    - mkdir
    - approve
    - debug_info

# Protocol conventions that a single route cannot show.
# Details — spec/AGENTS.md; here short and machine-readable.
x-protocol-rules:
  websocket: >-
    state only. The client sends `{t:"state", epoch, client_epoch,
    max_commandno}` and `{t:"ping", no}`; the server answers `{t:"state", epoch,
    max_commandno}` and `{t:"pong", no}`. There is no handshake frame:
    everything a node says about itself travels in announce
  epoch: >-
    the server generation is the identity token of a connection. announce with
    `epoch: null` means the client lost its state and closes that node's
    in-flight commands as `node_restarted`; announce with a different epoch is
    409 `epoch-mismatch`; a state frame or a commands request with a different
    epoch is 4409 (reason `epoch`) on the socket and 409 `epoch-mismatch` over
    HTTP
  client-epoch: >-
    the client's own counter, incremented on every connection — reconnects and
    restarts alike. Lower than the one already known for the node is 4001
    (reason `client-epoch`) on the socket and 409 `client-epoch-stale` over HTTP
  max-commandno-mismatch: >-
    a claim the client makes in a state frame or a commands request is only
    logged with both numbers; no reaction is decided yet
  websocket-close-codes:
    4001: replaced, or a stale client epoch (reason `client-epoch`)
    4400: a frame that is not part of the protocol
    4401: the token was revoked, or the socket went silent
    4409: epoch mismatch (reason `epoch`)
  control-prefix: "#"
  control-api: -1
  control-namespace: internal
  control-example: '#INTERNAL.CANCEL'
  control-commands: ['#INTERNAL.CANCEL', '#INTERNAL.FLUSH', '#INTERNAL.APPROVE']
  control-approve-ttl: approvalTtlSeconds in the plugin config, a day by default
  control-ttl-seconds: 86400
  control-tolerates: [late delivery, duplicates, missing target]
  control-priority: control commands outrank user work (cancellation must not
    queue behind the command it cancels). `#INTERNAL.CANCEL` runs at 10,
    `#INTERNAL.APPROVE` at 5, user work at 0; `#INTERNAL.FLUSH` inherits the
    priority of the command it was placed for, so it holds user work and lets
    control commands through
  control-flush: >-
    '#INTERNAL.FLUSH' is the barrier of the special rules. It is taken alone,
    nothing behind it is handed out while it is pending, and it reports ok
    whether it had something to wait for or not
  rule-bindings: a node binds its methods to server-side rules in a separate
    `applyRules` list, never inside the api def; the rule set is fixed and lives
    in spec/SPECIAL-RULES.md
  rule-errors: an unknown rule, an api or method the node does not declare, a
    duplicate binding or an unknown option refuses the announcement (400)
  commands-are-tickets: transfer routes are authorised by the served command
  streams: written to <hostPath>.inprogress and renamed only after a success
    verdict; the path is computed by the server, never taken from the body
  ephemeral: [command queue, seq counter]

paths:
  /v1/enroll:
    post:
      tags: [enroll]
      summary: Request access
      description: |
        Public route. The client sends its `uuid` and a `nonce`; the uuid is not
        a secret (it sits in config and shows up in logs), so the token is only
        released to whoever knows the nonce.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uuid]
              properties:
                uuid:
                  type: string
                  minLength: 8
                  maxLength: 64
                name:
                  type: string
                  maxLength: 64
                  description: preferred node name; defaults to `node-<first 8 of uuid>`
                nonce:
                  type: string
                  maxLength: 200
                  description: client secret; without it no token is issued
                clientVersion: { type: string }
      responses:
        "202":
          description: request accepted (or already existed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollStatus"
        "429":
          $ref: "#/components/responses/Error"

  /v1/enroll/{uuid}:
    get:
      tags: [enroll]
      summary: Poll a request
      description: |
        While the owner has not decided the answer is `202 pending`. Once
        approved, the token is returned **once**; a second delivery requires an
        admin action.
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string }
        - name: nonce
          in: query
          required: false
          description: must match the value sent with the request
          schema: { type: string }
      responses:
        "200":
          description: approved; the token is in this response and nowhere else
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrolled"
        "202":
          description: waiting for the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollStatus"
        "403": { description: rejected, or the nonce did not match }
        "404": { description: no such request }
        "409": { description: the token was already handed out }

  /v1/pair:
    post:
      tags: [enroll]
      summary: Exchange a pairing code for a token
      description: Public route for "the owner shows a code, the client enters it".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: code from the pairing link }
                name: { type: string, maxLength: 64 }
                aliases:
                  type: array
                  maxItems: 8
                  items: { type: string, maxLength: 64 }
                uuid: { type: string }
                clientVersion: { type: string }
      responses:
        "200":
          description: node created, token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrolled"
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: the code was already used }
        "410": { description: the code expired }

  /v1/announce:
    put:
      tags: [node]
      summary: Announce APIs and policy
      security: [{ nodeToken: [] }]
      description: |
        The only place where a node describes itself: which APIs it holds, what
        its ceiling is, whether it can ask a human and how long it has been
        running.

        Two nodes announcing the same API name with different schemas is not an
        error: versions stay separate and the response lists warnings. Change a
        schema — bump the version. The version is the **contract** version, not
        the client version; fusing two contracts makes the server use whichever
        schema it saw first.

        This is also where the client states its generation, and it is the only
        statement that can close in-flight commands:

        | `epoch` | meaning | answer |
        | --- | --- | --- |
        | the current one | the client lives in this server generation | 200 |
        | `null` (or absent) | the client restarted and lost its state | 200, after closing every `processing` command of this node with `node_restarted` |
        | a different one | the client is talking from another life of the server | `409 epoch-mismatch`, nothing is written |
        | `client_epoch` lower than known | an older instance of the node is talking | `409 client-epoch-stale`, nothing is written |

        Without the socket this route carries no presence: the socket says "I am
        waiting", announce says "this is what I am".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Announce"
      responses:
        "200":
          description: accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnounceAccepted"
        "400": { $ref: "#/components/responses/Error" }
        "409":
          description: |
            `epoch-mismatch` — the client named another server generation;
            `client-epoch-stale` — the client's own generation is older than the
            one this node is already known by. Nothing is written in either case:
            the client reconnects and announces `epoch: null`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/state:
    get:
      tags: [node]
      summary: Node and queue state
      security: [{ nodeToken: [] }]
      responses:
        "200":
          description: state of this node and its queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeState"

  /v1/commands:
    get:
      tags: [node]
      summary: Take commands to execute
      security: [{ nodeToken: [] }]
      description: |
        Takes up to `limit` commands **from the head** of the queue among `ready`,
        marks them `processing` and returns them. Taken commands are never handed
        out again — not to this client, not to another one.

        With nothing ready the batch is empty and `ready` is zero; the client
        should then say "I am waiting" with a `state` frame instead of polling.

        `epoch` and `client_epoch` travel as query parameters and are checked
        exactly like in `announce`: a different server generation is
        `409 epoch-mismatch`, an older client generation is
        `409 client-epoch-stale`, and neither hands out a command. Both are
        optional: a client that states neither is not checked, which is how an
        older client keeps working — it just cannot prove where it stands.

        `session.chdir` arrives through this same route as an ordinary command of
        the internal `session` API. Control commands use the reserved namespace
        (`api = -1`, name starts with `#`): `#INTERNAL.CANCEL` outranks user work,
        `#INTERNAL.FLUSH` is a barrier, `#INTERNAL.APPROVE` (priority 5) asks the
        human.

        Run independent commands of a batch in parallel if you like, but keep a
        cap (the reference client uses 5): one model turn can produce a dozen
        calls, and a node must not be flooded.

        Do not wait for the whole batch before taking again. A cancellation is a
        command too, and it sits in the queue behind the command it cancels: a
        client that blocks on its batch never sees `#INTERNAL.CANCEL` issued
        during a long command. Take no more than the free slots in one request
        and come back for more as soon as a slot frees. The batch has no special
        cases: `session.chdir` is ordered by its own `flushAround` rule, and every
        command — control commands included — takes a pool slot.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 5, default: 5 }
        - name: epoch
          in: query
          required: false
          description: |
            The server generation the client lives in. A different one is refused
            with `409 epoch-mismatch`; the client reconnects and announces
            `epoch: null`.
          schema: { type: integer, nullable: true }
        - name: client_epoch
          in: query
          required: false
          description: |
            The client's own generation counter, the same one it announced. Lower
            than the known one is `409 client-epoch-stale`: an older instance of
            the node is talking.
          schema: { type: integer, nullable: true }
        - name: max_commandno
          in: query
          required: false
          description: |
            The last command number the client knows. A divergence from the
            server's own number is only logged for now; it changes no behaviour.
          schema: { type: integer, nullable: true }
      responses:
        "200":
          description: a batch of commands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandBatch"
        "401": { $ref: "#/components/responses/Error" }
        "409":
          description: |
            `epoch-mismatch` or `client-epoch-stale`; nothing is handed out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/commands/{seq}/result:
    post:
      tags: [node]
      summary: Report the outcome
      security: [{ nodeToken: [] }]
      description: |
        Results are accepted after the model has already seen a timeout: a command
        lives until its `timeout`, and answering for a closed one returns `409`,
        which a client is expected to ignore.

        The last block of `results` is a JSON object with the exit code and the
        sandbox report; that is how the server learns the kernel denied something
        rather than the command simply failing.
      parameters:
        - name: seq
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Result"
      responses:
        "200": { description: accepted }
        "404": { description: no such command }
        "409": { description: the command is already closed (late result) }

  /v1/ws:
    get:
      tags: [presence]
      summary: Presence WebSocket
      description: |
        Protocol upgrade. Frames are short JSON; command data always travels over
        HTTP. The token goes in the `Sec-WebSocket-Protocol` header, never in the
        URL — a URL ends up in proxy logs and browser history.

        Two frames in, two frames out. There is no handshake: the client first
        announces over HTTP (that is where its generation is settled) and then
        says `state` when it starts waiting.

        Client to server — exactly two frames:

         - `{t:"state", epoch, client_epoch, max_commandno}` — "I am alive and I am
           waiting, I live in generation `epoch`, my own generation is
           `client_epoch`, and I know commands up to `max_commandno`". This one
           frame is both presence and the wait flag: the server pushes
           `{t:"state", ...}` at once when its number is already higher, otherwise
           it stays silent and remembers the wait, so the answer arrives with the
           next command. An idle node and an idle server exchange nothing but this
           one number.
         - `{t:"ping", no}` — keepalive; the server echoes the same `no`.

        Server to client — exactly two frames:

         - `{t:"state", epoch, max_commandno}` — "my number is higher than yours,
           go fetch"; the client adopts the number the server names, holes
           included. It is sent only to a node that declared it is waiting;
         - `{t:"pong", no}`.

        `max_commandno` in a `state` frame is a claim, not an identity: a
        divergence from the server's own number is logged with both numbers and
        changes nothing else.

        The generations are checks, and a failed check closes the socket — the
        client reconnects from scratch with `epoch: null`, which is the only
        statement that closes in-flight commands:

        | frame | condition | close code | reason |
        | --- | --- | --- | --- |
        | `state` | `epoch` is missing or is not the current one | `4409` | `epoch` |
        | `state` | `client_epoch` lower than the one known for the node | `4001` | `client-epoch` |
        | any | the frame is not part of the protocol | `4400` | `unknown-frame` / `bad-json` / `no-t` |

        Other closes: `4001 replaced` when a newer socket takes the place of an
        older one, `4401` when the token is revoked, `4401 silent` when the
        keepalive misses too many times.

        Without the socket a client still works: it keeps fetching commands over
        HTTP and just does not learn about new work instantly.
      responses:
        "101":
          description: switched to the WebSocket protocol

  /v1/events:
    post:
      tags: [devices]
      summary: Событие устройства
      description: |
        Узел сообщает, что на устройстве что-то произошло: нажата кнопка в
        уведомлении, сработал будильник, пришёл сигнал от человека.

        Имя устройства, время и обрамление добавляет сервер: клиенту нельзя
        доверять трактовку смысла, он сообщает только факт. Событие кладётся в
        указанную сессию как пользовательское сообщение с источником
        `dsh-nodes`, после чего ход просыпается.

        Ответ приходит до того, как модель начнёт работу: иначе устройство
        ждало бы окончания хода.
      security:
        - nodeToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session, text]
              properties:
                session:
                  type: string
                  description: Идентификатор сессии вида `session-<uuid>`
                text:
                  type: string
                button:
                  type: string
                  description: Метка нажатой кнопки, если событие из уведомления
                purpose:
                  type: string
                  description: Зачем это событие — модель увидит это первым
                id:
                  type: string
                  description: Идентификатор события для дедупликации
      responses:
        '200':
          description: Событие принято и передано агенту
          content:
            application/json:
              schema:
                type: object
                properties:
                  delivered: { type: boolean }
                  session: { type: string }
                  device: { type: string }
        '400':
          description: Нет сессии или текста
        '403':
          description: Для устройства события выключены
        '404':
          description: Сессии больше нет

  /v1/upload-file:
    post:
      tags: [transfer]
      summary: Передать файл с узла на сервер (хост)
      description: |
        Один HTTP-запрос вместо прежних кусков. Требуется `content-length` и
        `seq` в параметрах запроса; данные пишутся в `<path>.inprogress` и
        переименовываются только после сверки sha256.

        Исключение — `pipeFromDevice`: тело может идти chunked, без
        `content-length`, тогда файл остаётся `.inprogress` до вердикта команды.

        Длина тела не ограничена `maxBodyBytes`: тот потолок только для JSON.
        Передачу ограничивает `maxTransferBytes` — объявленная длина больше
        предела получает `413` до записи, поток обрывается, как только перевалил
        за предел (`.inprogress` удаляется).
      security:
        - nodeToken: []
      parameters:
        - name: seq
          in: query
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Файл принят, sha256 совпал
        '400':
          description: Нет длины, имени или seq
        '411':
          description: Нет `content-length` у передачи, которая не является потоком `pipeFromDevice`
        '413':
          description: Тело больше `maxTransferBytes`; для объявленной длины — до записи, для потока — обрыв на ходу

  /v1/download-file:
    post:
      tags: [transfer]
      summary: Передать файл с сервера (хоста) на узел
      description: |
        Симметричен выгрузке: сервер отдаёт поток, узел сохраняет его через
        `.inprogress` и проверяет sha256 перед переименованием.
      security:
        - nodeToken: []
      parameters:
        - name: seq
          in: query
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Поток файла
          content:
            application/octet-stream:
              schema: { type: string, format: binary }

components:
  securitySchemes:
    nodeToken:
      type: http
      scheme: bearer
      description: node token obtained from enroll or pair

  responses:
    Error:
      description: error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }

    EnrollStatus:
      type: object
      description: |
        State of an enrollment request. `pending` — the owner has not decided;
        `approved` — a token will be issued on the next poll; `rejected` — the
        owner said no, asking again needs a new request; `handed` — the token was
        already delivered exactly once and will not be repeated.
      properties:
        status:
          type: string
          enum: [pending, approved, rejected, handed]
        uuid:
          type: string
          description: client identity from the request; the same uuid keeps the same enrollment

    Enrolled:
      type: object
      description: |
        Successful enrollment or pairing. The token is shown here and nowhere
        else: store it, because a second delivery requires an admin action on the
        server.
      properties:
        token:
          type: string
          description: bearer token for every node call; treat it as a secret
        node:
          type: integer
          description: numeric node id, for logs and admin correlation only — calls address nodes by alias
        alias:
          type: string
          description: |
            Primary name of the node: the one to use in `nodes_call`. Assigned by
            the server, unique, and safe to show to a human.
        aliases:
          type: array
          items: { type: string }

    MethodDef:
      type: object
      required: [method, args]
      description: |
        One method of a node-side API, as the node announced it. The server
        validates every call against `args` before anything reaches the node, so
        a schema that lies produces confusing `bad_args` errors rather than bad
        execution — be precise.
      properties:
        method:
          type: string
          description: method name inside the API, e.g. `exec` or `chdir`
        args:
          type: object
          description: |
            JSON schema of the arguments. Required: a method without a schema is
            rejected at announce time, because the server would have nothing to
            validate against.
        description:
          type: string
          description: one line for the model; shown in the catalog

    ApiDef:
      type: object
      required: [name, version, methods]
      properties:
        id:
          type: integer
          description: server-assigned id; clients must not invent one
        name: { type: string }
        version:
          type: string
          description: |
            **Contract** version. Bump it whenever the schema of any method
            changes; nodes with different versions of the same name stay separate.
        methods:
          type: array
          items: { $ref: "#/components/schemas/MethodDef" }

    Announce:
      type: object
      required: [apis]
      properties:
        apis:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ApiDef" }
        applyRules:
          type: array
          description: |
            Bindings «a method of this node → a server-side rule». Optional, and
            deliberately separate from `apis`: a rule says how *this machine*
            executes a command, not what the API contract is, so an API def that
            came from an outside source (an MCP server, say) never has to carry
            server-only fields.

            Everything here is checked against the rest of the announcement. An
            unknown rule, an api this node does not hold, a method that api does
            not declare, a duplicate binding or an unknown option refuses the
            whole announcement with `400 apply-rules-invalid` — a binding that
            silently does nothing is worse than a refusal. A rule that would
            measure nothing (for instance `timing` without `retNames`) is accepted
            with a warning.
          items:
            type: object
            required: [api, method, rule]
            properties:
              api:
                type: string
                description: API name, as announced by this node
              version:
                type: string
                description: |
                  Optional narrowing: bind the rule to one contract version.
                  Without it the rule applies to this api name on this node,
                  whatever version it is running.
              method:
                type: string
                description: method name inside that api
              rule:
                type: string
                enum: [timing, flushBefore, flushAfter, flushAround]
                description: |
                  The fixed rule set and the contract of each rule live in
                  `spec/SPECIAL-RULES.md`. The node binds and never learns which
                  rule fired.
              rulesOpts:
                type: object
                additionalProperties: false
                description: options of the rule; every rule has its own
                properties:
                  retNames:
                    type: object
                    additionalProperties:
                      type: [string, "null"]
                    description: |
                      For `timing`: canonical name → the field in the node's
                      reply where the number is placed. `durationMs` is computed
                      from the server's own stamps and needs nothing from the
                      node; `clockSkewMs` needs the node's clock, which arrives
                      in the `now` field of the result envelope. A canonical name
                      left out (or set to null) is not placed anywhere: measuring
                      into nowhere is allowed, inventing a field name is not.
        epoch:
          type: integer
          nullable: true
          description: |
            The server generation the client lives in, taken from a previous
            answer. `null` is a statement, not a missing value: the client
            restarted and lost its state, so every command this node is still
            supposed to be executing is closed as `node_restarted`. A different
            generation is refused with `409 epoch-mismatch` and nothing is
            written.
        client_epoch:
          type: integer
          nullable: true
          description: |
            The client's own generation: a persistent counter, incremented on
            every connection — reconnects and restarts alike. It is stored per
            node and survives a server restart, so a stale instance of the node
            can be recognised by a lower number (`409 client-epoch-stale`) even
            after the server itself restarted.
        clientVersion: { type: string }
        platform:
          type: string
          maxLength: 32
          description: |
            What the client runs on: `desktop`, `android`. Stored on the node and
            shown in the admin panel; the client version usually carries the same
            prefix, but this field is the statement itself. Cosmetic: a value that
            is not a non-empty string of at most 32 characters after trimming is
            ignored instead of refusing the announcement, and an announcement
            without the field keeps the value the node told earlier.
        access:
          type: string
          enum: [ro, rw, full]
          description: ceiling on this machine, set by the machine owner
        allowEscalation:
          type: boolean
          description: deprecated, kept for older clients; prefer `approver`
        approver:
          type: string
          enum: [local, server, none]
          description: |
            Who may answer a question about a wider mode. `local` — the human at
            this machine, and a promise to implement `#INTERNAL.APPROVE`; the
            server takes the promise as given, and a node without the command
            answers `unknown_method`. `server` — the human in the DSH dialog.
            `none` — never ask.
        base:
          type: string
          enum: [ro, rw, full]
          description: |
            Mode a command starts in. It may be narrower than `access` (the
            ceiling): then widening needs a human decision, either after a denial
            or up front through `sandboxStrict`. Confirmed commands are not
            lowered by it.
        workdir: { type: string }
        uptimeSeconds:
          type: number
          description: |
            Seconds since the process started — a delta, not a timestamp. Node
            clocks drift or lie; the server converts the delta to its own clock at
            the moment of the message and only adds its own time afterwards, so a
            broken clock cannot produce a negative uptime.

    QueueState:
      type: object
      description: |
        How much work the queue holds for one node. Sent in `announce`,
        `GET /v1/state` and every command batch, so a client can decide whether a
        fetch is worth making without asking twice.
      properties:
        epoch:
          type: integer
          description: |
            Server generation: it changes on every server restart, and it is the
            identity token of a connection. A client that names a stale one is
            refused (`409 epoch-mismatch` over HTTP, close code `4409` on the
            socket) and starts over by announcing `epoch: null`; a client that
            names the current one is simply in the same life of the server.
        max_commandno:
          type: integer
          description: |
            Last command number handed out to this node since the server started.
            Numbers are honest: they grow by one per queued command, are never
            reused, and a number spent on a command the node never saw (a
            cancellation, an expired entry) stays spent.

            So "I know up to N" means "anything new will be ≥ N+1", and the
            client should adopt the number the server names instead of computing
            a maximum over the commands it happened to receive: a hole in the
            numbering can never be caught up by that maximum.

            It is not a delivery watermark — a command counted here may already
            be executing.
        queued:
          type: integer
          description: commands held in the queue for this node, including the ones being executed
        ready:
          type: integer
          description: commands that have not been handed out yet and will come on the next fetch
        waiting:
          type: integer
          description: |
            Models currently blocked on a result from this node. Useful when
            reading a journal: a non-zero value with no traffic means somebody is
            waiting and the node is silent.

    SandboxFacts:
      type: object
      description: |
        The client's honest report of how the command ran. `mode` is the mode it
        actually used, not the one requested — the server trusts this number over
        its own expectations.

        This model is not referenced by `$ref` from any response: it describes the
        JSON object *inside* the last `results` text block (see `Result`), and a
        string field cannot carry a schema.
      properties:
        mode:
          type: string
          enum: [ro, rw, full]
        enforcement:
          type: string
          enum: [none, bwrap]
        denied:
          type: boolean
          description: the kernel refused part of the work (a write outside the allowed roots)
        failed:
          type: boolean
          description: the command exited non-zero
        signature:
          type: string
          nullable: true
          description: denial signature, e.g. `read-only file system`
        runnerFailure:
          type: boolean
          description: the sandbox itself failed, not the command
        escalation:
          type: integer
          description: escalation step on which the command ran

    NodeState:
      type: object
      description: |
        Answer to `GET /v1/state`: what this node is and how much work waits for
        it. The node is identified by its number here — calls address nodes by
        alias, and this field exists for logs and for correlating with the admin
        panel, not for calling.
      allOf:
        - $ref: "#/components/schemas/QueueState"
        - type: object
          properties:
            node:
              type: integer
              description: numeric node id, the same one the admin panel shows
            online:
              type: boolean
              description: |
                Whether the node is considered reachable right now: a live socket
                or a recent request. It is not a promise that the next command
                will be picked up — a node can hold a socket and be busy.

    AnnounceAccepted:
      type: object
      description: |
        Answer to `PUT /v1/announce`: the ids assigned to the APIs this node just
        declared, plus any warnings about schema conflicts with other nodes.

        The ids are what a command carries in its `api` field, so a client must
        keep them. They are not stable across a node being deleted and re-created,
        and they differ per node: the same `session` API may be `3` on one node
        and `4` on another, which is why the server never addresses a node by an
        id from somewhere else.
      allOf:
        - $ref: "#/components/schemas/QueueState"
        - type: object
          properties:
            apis:
              type: array
              description: ids assigned to the announced APIs, in the order given
              items:
                type: object
                properties:
                  id:
                    type: integer
                    description: number to use in `Command.api` for this node
                  name:
                    type: string
                  version:
                    type: string
                    nullable: true
            warnings:
              type: array
              description: |
                Schema conflicts with other nodes announcing the same name with a
                different contract. Not an error: versions stay separate, and the
                warning exists so a human can see the divergence.
              items: { type: string }

    CommandBatch:
      type: object
      description: |
        What one `GET /v1/commands` call returns. The commands are already marked
        as being executed: another fetch will not return them, and neither will a
        fetch from a different client of the same node.
      properties:
        commands:
          type: array
          description: commands to execute now, oldest first
          items: { $ref: "#/components/schemas/Command" }
        ready:
          type: integer
          description: |
            How many commands are still waiting after this batch. A non-zero value
            means the client may fetch again immediately instead of waiting for a
            notification.
        epoch:
          type: integer
          description: server generation; a client that does not recognise it has to announce again

    Command:
      type: object
      required: [seq, api, method, timeout]
      properties:
        seq:
          type: integer
          description: command number; results are posted against it
        api: { type: integer, description: API id from this node's `announce` answer }
        method: { type: string }
        args: { type: object }
        timeout:
          type: integer
          description: seconds; 600 by default
        sandbox:
          type: object
          properties:
            mode:
              type: string
              enum: [ro, rw, full]
            root: { type: string }
          description: |
            Requested mode, computed by the server from the session policy. A node
            clamps it by its own ceiling and starting mode.
        approved:
          type: string
          description: |
            Approval id. Set by the **server only**: a client that sees this field
            coming from a model must ignore it. An approved command is not lowered
            by the node's starting mode, but is still bounded by its ceiling.
        escalation:
          type: integer
          description: 0 for a plain run, 1 after the first approval, 2 after the second
        issuedAt:
          type: number
          description: |
            Server timestamp, milliseconds with fractions, taken when the command
            was queued. It tells a node how long the command waited before it was
            handed out; the server measures execution itself, through the `timing`
            rule, and does not expect anything echoed back.
        session:
          type: string
          description: |
            Model session id. The client uses it to keep a per-session working
            directory, and the approval tool receives it as `DSHNC_SESSION`.
        question:
          type: object
          nullable: true
          description: |
            Which question of the human this command belongs to: the root tool
            call of the turn. The approval dialog receives these ids in the
            environment, so a local tool can remember "answer yes until the end
            of this question" (`rootCallId`) or "until the end of this session"
            (`session`).
          properties:
            rootCallId:
              type: string
              description: root tool call of the turn — stable for every command made within one question
            callId:
              type: string
              nullable: true
              description: the exact call that produced this command; handy for logs, not for caching decisions

    Result:
      type: object
      description: |
        Outcome of one command. `ok: false` is a normal answer, not a transport
        failure: the command may have failed to start, timed out, or been refused
        by the sandbox. Machine-readable detail goes into `results`, which the
        model reads like any other tool output.
      required: [ok]
      properties:
        ok: { type: boolean }
        code: { type: string, nullable: true, description: machine-readable error code }
        message: { type: string, nullable: true }
        now:
          type: number
          description: |
            The node's own wall clock at the moment it answered, milliseconds with
            fractions. Every result carries it — it is a plain fact about the
            answer, not rule-awareness. The server reads it only when a rule asks
            for it: `timing` uses it to compute `clockSkewMs`, and nothing else
            looks at it.
        results:
          type: array
          description: |
            Result blocks. The last one is usually a JSON object with `code`,
            `signal`, `cwd` and `sandbox` (the shape is `SandboxFacts` below).

            A method bound to the `timing` rule gets its numbers written into that
            last JSON object, under the names the binding asked for in
            `retNames`. The node takes no part in the measurement: `durationMs`
            comes from the server's own stamps, and `clockSkewMs` from the `now`
            field of this envelope. The only thing the node can prevent is the
            skew — by not sending `now`.
          items:
            type: object
            properties:
              type: { type: string, enum: [text] }
              text: { type: string }
