# Client protocol of dsh-nodes.
#
# Everything a new client needs — Android, Go, anything — to talk to a DSH
# server: register the node, announce its APIs, keep presence, fetch commands and
# report results.
#
# Deliberately absent:
#  - the admin API under /api/dsh-nodes/* — private, behind the DSH session;
#  - the contract of node-side plugins (shell, job, session) — the server only
#    knows what a node announced in `announce`, and that is the point.
openapi: 3.1.0

info:
  title: dsh-nodes client API
  version: "1"
  description: |
    How a node talks to a DSH server.

    Three behaviours deserve attention because a client that gets them wrong will
    look like it works and then quietly lose commands.

    **A command is handed out once.** `GET /v1/commands` takes a batch from the
    head of the queue and moves it to `processing`. There is no lease and no
    redelivery: taken means either executed or attempted. A node that dies mid
    command leaves it `processing`; the server closes it as `lost` after the
    timeout so the model gets an answer instead of silence.

    **Approval is an ordinary command.** When the sandbox denies a command, the
    server queues `session.approve` on the node with a long timeout and returns
    the denial to the model at once — nothing waits.

    **`approver: "local"` is a promise.** A node announcing it must implement
    `session.approve`. The server checks the announcement and falls back to
    `approver: "none"` if the method is missing.

servers:
  - url: https://dsh.example.com/dsh-nodes
    description: prefix configured on the plugin; it can be any path

tags:
  - name: enroll
    description: how a node gets onto the server
  - name: node
    description: presence, API announcement, command delivery
  - name: presence
    description: WebSocket used only for cheap wake-ups


# Кадры websocket. Список машиночитаемый: тест сверяет его с кодом, чтобы
# схема не отставала от реализации.
x-ws-frames:
  - hello
  - hello-ok
  - check_state
  - alive
  - state
  - ping
  - pong
  - work
  - error

# Методы, которые объявляют клиентские API. Список сверяется тестом с
# описаниями в репозитории клиента: так schema догоняет код сразу, а не через
# неделю.
x-client-methods:
  files:
    - roots
    - list
    - stat
    - read
    - write
    - edit
    - mkdir
    - sha256
    - copyToDevice
    - copyFromDevice
  notifications:
    - post
  session:
    - ping
    - version
    - id
    - cwd
    - chdir
    - mkdir
    - approve
    - debug_info

# Соглашения протокола, которые не видны из отдельного маршрута.
# Подробно — spec/AGENTS.md; здесь коротко и машинночитаемо.
x-protocol-rules:
  websocket: state only (hello/check_state/state); ping/pong is the single
    exception and a failed ping drops the socket
  control-prefix: "#"
  control-api: -1
  control-namespace: internal
  control-example: '#INTERNAL.CANCEL'
  control-ttl-seconds: 86400
  control-tolerates: [late delivery, duplicates, missing target]
  rule-bindings: a node binds its methods to server-side rules in a separate
    `applyRules` list, never inside the api def; the rule set is fixed and lives
    in spec/SPECIAL-RULES.md
  rule-errors: an unknown rule, an api or method the node does not declare, a
    duplicate binding or an unknown option refuses the announcement (400)
  commands-are-tickets: transfer routes are authorised by the served command
  streams: written to <hostPath>.inprogress and renamed only after a success
    verdict; the path is computed by the server, never taken from the body
  ephemeral: [command queue, seq counter]

paths:
  /v1/enroll:
    post:
      tags: [enroll]
      summary: Request access
      description: |
        Public route. The client sends its `uuid` and a `nonce`; the uuid is not
        a secret (it sits in config and shows up in logs), so the token is only
        released to whoever knows the nonce.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uuid]
              properties:
                uuid:
                  type: string
                  minLength: 8
                  maxLength: 64
                name:
                  type: string
                  maxLength: 64
                  description: preferred node name; defaults to `node-<first 8 of uuid>`
                nonce:
                  type: string
                  maxLength: 200
                  description: client secret; without it no token is issued
                proto: { type: integer }
                clientVersion: { type: string }
      responses:
        "202":
          description: request accepted (or already existed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollStatus"
        "429":
          $ref: "#/components/responses/Error"

  /v1/enroll/{uuid}:
    get:
      tags: [enroll]
      summary: Poll a request
      description: |
        While the owner has not decided the answer is `202 pending`. Once
        approved, the token is returned **once**; a second delivery requires an
        admin action.
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string }
        - name: nonce
          in: query
          required: false
          description: must match the value sent with the request
          schema: { type: string }
      responses:
        "200":
          description: approved; the token is in this response and nowhere else
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrolled"
        "202":
          description: waiting for the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollStatus"
        "403": { description: rejected, or the nonce did not match }
        "404": { description: no such request }
        "409": { description: the token was already handed out }

  /v1/pair:
    post:
      tags: [enroll]
      summary: Exchange a pairing code for a token
      description: Public route for "the owner shows a code, the client enters it".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: code from the pairing link }
                name: { type: string, maxLength: 64 }
                aliases:
                  type: array
                  maxItems: 8
                  items: { type: string, maxLength: 64 }
                uuid: { type: string }
                proto: { type: integer }
                clientVersion: { type: string }
      responses:
        "200":
          description: node created, token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrolled"
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: the code was already used }
        "410": { description: the code expired }

  /v1/announce:
    put:
      tags: [node]
      summary: Announce APIs and policy
      security: [{ nodeToken: [] }]
      description: |
        The only place where a node describes itself: which APIs it holds, what
        its ceiling is, whether it can ask a human and how long it has been
        running.

        Two nodes announcing the same API name with different schemas is not an
        error: versions stay separate and the response lists warnings. Change a
        schema — bump the version. The version is the **contract** version, not
        the client version; fusing two contracts makes the server use whichever
        schema it saw first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Announce"
      responses:
        "200":
          description: accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnounceAccepted"
        "400": { $ref: "#/components/responses/Error" }

  /v1/state:
    get:
      tags: [node]
      summary: Node and queue state
      security: [{ nodeToken: [] }]
      responses:
        "200":
          description: state of this node and its queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeState"

  /v1/commands:
    get:
      tags: [node]
      summary: Take commands to execute
      security: [{ nodeToken: [] }]
      description: |
        Takes up to `limit` commands **from the head** of the queue among `ready`,
        marks them `processing` and returns them. Taken commands are never handed
        out again — not to this client, not to another one.

        With nothing ready the batch is empty and `ready` is zero; the client
        should then wait for a `check_state` answer instead of polling.

        `session.chdir` and `session.approve` arrive through this same route:
        they are ordinary commands carrying methods of the internal `session`
        API.

        Run independent commands of a batch in parallel if you like, but keep a
        cap (the reference client uses 5): one model turn can produce a dozen
        calls, and a node must not be flooded. `session.chdir` must be applied
        first and in order — it changes the session working directory, so the
        rest of the batch has to start in the new one. `session.approve` should
        run outside the pool: a dialog may hang for a day and must not hold a
        slot.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 5, default: 5 }
      responses:
        "200":
          description: a batch of commands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandBatch"
        "401": { $ref: "#/components/responses/Error" }

  /v1/commands/{seq}/result:
    post:
      tags: [node]
      summary: Report the outcome
      security: [{ nodeToken: [] }]
      description: |
        Results are accepted after the model has already seen a timeout: a command
        lives until its `timeout`, and answering for a closed one returns `409`,
        which a client is expected to ignore.

        The last block of `results` is a JSON object with the exit code and the
        sandbox report; that is how the server learns the kernel denied something
        rather than the command simply failing.
      parameters:
        - name: seq
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Result"
      responses:
        "200": { description: accepted }
        "404": { description: no such command }
        "409": { description: the command is already closed (late result) }

  /v1/ws:
    get:
      tags: [presence]
      summary: Presence WebSocket
      description: |
        Protocol upgrade. Frames are short JSON; command data always travels over
        HTTP. The token goes in the `Sec-WebSocket-Protocol` header, never in the
        URL — a URL ends up in proxy logs and browser history.

        Client to server:
         - `{t:"hello", epoch, known, access, workdir, allowEscalation, approver, uptimeSeconds, boot}` —
           the first frame; `epoch` from a previous connection lets the server
           answer `reconnect: true`;
         - `{t:"check_state", known}` — "I am alive, and I know commands up to
           `known`". The server answers with `{t:"state", state:N}` **at once** if
           `N > known`, otherwise it stays silent and marks the node as waiting,
           so the answer arrives later, pushed by a new command. This is the
           whole polling replacement: an idle node and an idle server exchange
           nothing but this one number. `known: null` means the client lost
           its state, i.e. it restarted: the server answers at once and closes
           every command it had handed to that node with `node_restarted`, so
           the model learns the result is gone instead of waiting for a timeout.
           The old frame name `alive` is still accepted;
         - `{t:"pong"}`.

        Server to client:
         - `{t:"hello-ok", epoch, state, reconnect}`;
         - `{t:"state"}` — "there are commands, go fetch them";
         - `{t:"ping"}`.

        Without the socket a client still works, it just learns about work on the
        next poll.
      responses:
        "101":
          description: switched to the WebSocket protocol

  /v1/events:
    post:
      tags: [devices]
      summary: Событие устройства
      description: |
        Узел сообщает, что на устройстве что-то произошло: нажата кнопка в
        уведомлении, сработал будильник, пришёл сигнал от человека.

        Имя устройства, время и обрамление добавляет сервер: клиенту нельзя
        доверять трактовку смысла, он сообщает только факт. Событие кладётся в
        указанную сессию как пользовательское сообщение с источником
        `dsh-nodes`, после чего ход просыпается.

        Ответ приходит до того, как модель начнёт работу: иначе устройство
        ждало бы окончания хода.
      security:
        - nodeToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session, text]
              properties:
                session:
                  type: string
                  description: Идентификатор сессии вида `session-<uuid>`
                text:
                  type: string
                button:
                  type: string
                  description: Метка нажатой кнопки, если событие из уведомления
                purpose:
                  type: string
                  description: Зачем это событие — модель увидит это первым
                id:
                  type: string
                  description: Идентификатор события для дедупликации
      responses:
        '200':
          description: Событие принято и передано агенту
          content:
            application/json:
              schema:
                type: object
                properties:
                  delivered: { type: boolean }
                  session: { type: string }
                  device: { type: string }
        '400':
          description: Нет сессии или текста
        '403':
          description: Для устройства события выключены
        '404':
          description: Сессии больше нет

  /v1/upload-file:
    post:
      tags: [transfer]
      summary: Передать файл с узла на сервер (хост)
      description: |
        Один HTTP-запрос вместо прежних кусков. Требуется `content-length` и
        `seq` в параметрах запроса; данные пишутся в `<path>.inprogress` и
        переименовываются только после сверки sha256.
      security:
        - nodeToken: []
      parameters:
        - name: seq
          in: query
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Файл принят, sha256 совпал
        '400':
          description: Нет длины, имени или seq

  /v1/download-file:
    post:
      tags: [transfer]
      summary: Передать файл с сервера (хоста) на узел
      description: |
        Симметричен выгрузке: сервер отдаёт поток, узел сохраняет его через
        `.inprogress` и проверяет sha256 перед переименованием.
      security:
        - nodeToken: []
      parameters:
        - name: seq
          in: query
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Поток файла
          content:
            application/octet-stream:
              schema: { type: string, format: binary }

components:
  securitySchemes:
    nodeToken:
      type: http
      scheme: bearer
      description: node token obtained from enroll or pair

  responses:
    Error:
      description: error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }

    EnrollStatus:
      type: object
      description: |
        State of an enrollment request. `pending` — the owner has not decided;
        `approved` — a token will be issued on the next poll; `rejected` — the
        owner said no, asking again needs a new request; `handed` — the token was
        already delivered exactly once and will not be repeated.
      properties:
        status:
          type: string
          enum: [pending, approved, rejected, handed]
        uuid:
          type: string
          description: client identity from the request; the same uuid keeps the same enrollment

    Enrolled:
      type: object
      description: |
        Successful enrollment or pairing. The token is shown here and nowhere
        else: store it, because a second delivery requires an admin action on the
        server.
      properties:
        token:
          type: string
          description: bearer token for every node call; treat it as a secret
        node:
          type: integer
          description: numeric node id, for logs and admin correlation only — calls address nodes by alias
        alias:
          type: string
          description: |
            Primary name of the node: the one to use in `nodes_call`. Assigned by
            the server, unique, and safe to show to a human.
        aliases:
          type: array
          items: { type: string }

    MethodDef:
      type: object
      required: [method, args]
      description: |
        One method of a node-side API, as the node announced it. The server
        validates every call against `args` before anything reaches the node, so
        a schema that lies produces confusing `bad_args` errors rather than bad
        execution — be precise.
      properties:
        method:
          type: string
          description: method name inside the API, e.g. `exec` or `chdir`
        args:
          type: object
          description: |
            JSON schema of the arguments. Required: a method without a schema is
            rejected at announce time, because the server would have nothing to
            validate against.
        description:
          type: string
          description: one line for the model; shown in the catalog

    ApiDef:
      type: object
      required: [name, version, methods]
      properties:
        id:
          type: integer
          description: server-assigned id; clients must not invent one
        name: { type: string }
        version:
          type: string
          description: |
            **Contract** version. Bump it whenever the schema of any method
            changes; nodes with different versions of the same name stay separate.
        methods:
          type: array
          items: { $ref: "#/components/schemas/MethodDef" }

    Announce:
      type: object
      required: [apis]
      properties:
        apis:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ApiDef" }
        applyRules:
          type: array
          description: |
            Bindings «a method of this node → a server-side rule». Optional, and
            deliberately separate from `apis`: a rule says how *this machine*
            executes a command, not what the API contract is, so an API def that
            came from an outside source (an MCP server, say) never has to carry
            server-only fields.

            Everything here is checked against the rest of the announcement. An
            unknown rule, an api this node does not hold, a method that api does
            not declare, a duplicate binding or an unknown option refuses the
            whole announcement with `400 apply-rules-invalid` — a binding that
            silently does nothing is worse than a refusal. A rule that would
            measure nothing (for instance `timing` without `retNames`) is accepted
            with a warning.
          items:
            type: object
            required: [api, method, rule]
            properties:
              api:
                type: string
                description: API name, as announced by this node
              version:
                type: string
                description: |
                  Optional narrowing: bind the rule to one contract version.
                  Without it the rule applies to this api name on this node,
                  whatever version it is running.
              method:
                type: string
                description: method name inside that api
              rule:
                type: string
                enum: [timing, flushBefore, flushAfter, flushAround]
                description: |
                  The fixed rule set and the contract of each rule live in
                  `spec/SPECIAL-RULES.md`. The node binds and never learns which
                  rule fired.
              rulesOpts:
                type: object
                additionalProperties: false
                description: options of the rule; every rule has its own
                properties:
                  retNames:
                    type: object
                    additionalProperties:
                      type: [string, "null"]
                    description: |
                      For `timing`: canonical name → the field in the node's
                      reply where the number is placed. `durationMs` is computed
                      from the server's own stamps and needs nothing from the
                      node; `clockSkewMs` needs the node's clock, which arrives
                      in the `now` field of the result envelope. A canonical name
                      left out (or set to null) is not placed anywhere: measuring
                      into nowhere is allowed, inventing a field name is not.
        proto: { type: integer }
        clientVersion: { type: string }
        access:
          type: string
          enum: [ro, rw, full]
          description: ceiling on this machine, set by the machine owner
        allowEscalation:
          type: boolean
          description: deprecated, kept for older clients; prefer `approver`
        approver:
          type: string
          enum: [local, server, none]
          description: |
            Who may answer a question about a wider mode. `local` — the human at
            this machine, and a promise to implement `session.approve`: without
            that method the server refuses the promise and treats the node as
            `none`. `server` — the human in the DSH dialog. `none` — never ask.
        base:
          type: string
          enum: [ro, rw, full]
          description: |
            Mode a command starts in. It may be narrower than `access` (the
            ceiling): then widening needs a human decision, either after a denial
            or up front through `sandboxStrict`. Confirmed commands are not
            lowered by it.
        workdir: { type: string }
        uptimeSeconds:
          type: number
          description: |
            Seconds since the process started — a delta, not a timestamp. Node
            clocks drift or lie; the server converts the delta to its own clock at
            the moment of the message and only adds its own time afterwards, so a
            broken clock cannot produce a negative uptime.

    QueueState:
      type: object
      description: |
        How much work the queue holds for one node. Sent in `announce`,
        `GET /v1/state` and every command batch, so a client can decide whether a
        fetch is worth making without asking twice.
      properties:
        epoch:
          type: integer
          description: |
            Server generation: it changes on every server restart. A client that
            reconnects with a stale epoch learns that its previous state belongs
            to another life of the server.
        state:
          type: integer
          description: |
            Number of the last command ever queued for this node. The client
            compares it with what it already knows (`check_state`) to find out
            whether it is behind. It is not a delivery watermark: a command
            counted here may already be executing.
        queued:
          type: integer
          description: commands held in the queue for this node, including the ones being executed
        ready:
          type: integer
          description: commands that have not been handed out yet and will come on the next fetch
        waiting:
          type: integer
          description: |
            Models currently blocked on a result from this node. Useful when
            reading a journal: a non-zero value with no traffic means somebody is
            waiting and the node is silent.

    SandboxFacts:
      type: object
      description: |
        The client's honest report of how the command ran. `mode` is the mode it
        actually used, not the one requested — the server trusts this number over
        its own expectations.
      properties:
        mode:
          type: string
          enum: [ro, rw, full]
        enforcement:
          type: string
          enum: [none, bwrap]
        denied:
          type: boolean
          description: the kernel refused part of the work (a write outside the allowed roots)
        failed:
          type: boolean
          description: the command exited non-zero
        signature:
          type: string
          nullable: true
          description: denial signature, e.g. `read-only file system`
        runnerFailure:
          type: boolean
          description: the sandbox itself failed, not the command
        escalation:
          type: integer
          description: escalation step on which the command ran

    NodeState:
      type: object
      description: |
        Answer to `GET /v1/state`: what this node is and how much work waits for
        it. The node is identified by its number here — calls address nodes by
        alias, and this field exists for logs and for correlating with the admin
        panel, not for calling.
      allOf:
        - $ref: "#/components/schemas/QueueState"
        - type: object
          properties:
            node:
              type: integer
              description: numeric node id, the same one the admin panel shows
            online:
              type: boolean
              description: |
                Whether the node is considered reachable right now: a live socket
                or a recent request. It is not a promise that the next command
                will be picked up — a node can hold a socket and be busy.

    AnnounceAccepted:
      type: object
      description: |
        Answer to `PUT /v1/announce`: the ids assigned to the APIs this node just
        declared, plus any warnings about schema conflicts with other nodes.

        The ids are what a command carries in its `api` field, so a client must
        keep them. They are not stable across a node being deleted and re-created,
        and they differ per node: the same `session` API may be `3` on one node
        and `4` on another, which is why the server never addresses a node by an
        id from somewhere else.
      allOf:
        - $ref: "#/components/schemas/QueueState"
        - type: object
          properties:
            apis:
              type: array
              description: ids assigned to the announced APIs, in the order given
              items:
                type: object
                properties:
                  id:
                    type: integer
                    description: number to use in `Command.api` for this node
                  name:
                    type: string
                  version:
                    type: string
                    nullable: true
            warnings:
              type: array
              description: |
                Schema conflicts with other nodes announcing the same name with a
                different contract. Not an error: versions stay separate, and the
                warning exists so a human can see the divergence.
              items: { type: string }

    CommandBatch:
      type: object
      description: |
        What one `GET /v1/commands` call returns. The commands are already marked
        as being executed: another fetch will not return them, and neither will a
        fetch from a different client of the same node.
      properties:
        commands:
          type: array
          description: commands to execute now, oldest first
          items: { $ref: "#/components/schemas/Command" }
        ready:
          type: integer
          description: |
            How many commands are still waiting after this batch. A non-zero value
            means the client may fetch again immediately instead of waiting for a
            notification.
        epoch:
          type: integer
          description: server generation, so a stale client notices it reconnected

    PingReply:
      type: object
      description: |
        Reply of a node to the `ping` method of its internal `session` API — the
        cheap check "is this node alive and how far away is it".

        The node fills what only it can know: its own clock and how long it has
        been running. The round-trip time it cannot compute: that needs the
        server's clock, which the node has never seen. So the field `rttMs` is
        declared here and sent as `null`; the server fills it in place before the
        answer reaches the model, together with `clockSkewMs`.

        Reading the numbers: `rttMs` covers queueing plus network plus execution,
        so on a loaded server it is larger than a network ping. `clockSkewMs` is
        the node clock offset; on a slow round trip it grows by half of the extra
        time, so compare clocks using the smallest values of a series, not one
        measurement.
      properties:
        pong:
          type: number
          description: node wall clock at the moment of answering, milliseconds with fractions
        rttMs:
          type: number
          nullable: true
          description: round trip measured by the server; the node always sends `null`
        clockSkewMs:
          type: number
          description: how far the node clock is ahead of the server, in milliseconds
        sentAt:
          type: number
          nullable: true
          description: |
            The server timestamp echoed back (`issuedAt` of the command). Absent
            on nodes that predate timing support; then `rttMs` stays `null`.
        upSeconds:
          type: integer
          description: seconds since the node client process started; a delta, not a timestamp
        platform:
          type: string
          description: node platform, e.g. `linux`
        version:
          type: string
          description: client version, e.g. `dshnc/0.0.51`

    CheckStateFrame:
      type: object
      description: |
        Client to server, the only frame an idle node sends. It carries three
        meanings at once, because for a polling-free client they always coincide:
        "I am alive", "I know commands up to `known`", and "I am free, tell me if
        there is work".

        The server answers with `{t:"state", state:N}` only when `N > known`,
        otherwise it stays silent and remembers that the node is waiting, so the
        answer comes later, pushed by the new command. This is the whole reason
        there is no periodic polling.
      required: [t, known]
      properties:
        t: { type: string, enum: [check_state] }
        known:
          type: integer
          nullable: true
          description: |
            Highest command number the client has seen. `null` means the client
            lost its state, i.e. it restarted: the server answers at once and
            closes every command it had handed to this node with `node_restarted`,
            so the model learns the result is gone instead of waiting out its
            timeout.

    StateFrame:
      type: object
      description: |
        Server to client: "you are behind, fetch commands". Carries the number so
        the client can tell how far behind without an extra request.
      required: [t, state]
      properties:
        t: { type: string, enum: [state] }
        state:
          type: integer
          description: number of the last command queued for this node
        epoch:
          type: integer
          description: server generation; a change means the server restarted

    PingFrame:
      type: object
      description: |
        Application-level liveness check over the socket. The client pings after
        `pingInterval` of silence, stretching the pause up to
        `maxPingIntervalFactor` times when the server has not sent commands for a
        while. No answer within the interval means the connection is dead: the
        client drops it and reconnects. The server may ping the client too, but
        that direction is off by default.
      required: [t, id]
      properties:
        t: { type: string, enum: [ping] }
        id:
          type: integer
          description: sequence number chosen by the sender; the reply must carry the same one

    Command:
      type: object
      required: [seq, api, method, timeout]
      properties:
        seq:
          type: integer
          description: command number; results are posted against it
        api: { type: integer, description: API id from this node's `announce` answer }
        method: { type: string }
        args: { type: object }
        timeout:
          type: integer
          description: seconds; 600 by default
        sandbox:
          type: object
          properties:
            mode:
              type: string
              enum: [ro, rw, full]
            root: { type: string }
          description: |
            Requested mode, computed by the server from the session policy. A node
            clamps it by its own ceiling and starting mode.
        approved:
          type: string
          description: |
            Approval id. Set by the **server only**: a client that sees this field
            coming from a model must ignore it. An approved command is not lowered
            by the node's starting mode, but is still bounded by its ceiling.
        escalation:
          type: integer
          description: 0 for a plain run, 1 after the first approval, 2 after the second
        issuedAt:
          type: number
          description: |
            Server timestamp, milliseconds with fractions, taken when the command
            was queued. The node echoes it back in `ping`, and the server derives
            `rttMs` and the clock offset from it; it is also the only way for a
            node to know how long the command waited in the queue.
        session:
          type: string
          description: |
            Model session id. The client uses it to keep a per-session working
            directory, and the approval tool receives it as `DSHNC_SESSION`.
        question:
          type: object
          nullable: true
          description: |
            Which question of the human this command belongs to: the root tool
            call of the turn. The approval dialog receives these ids in the
            environment, so a local tool can remember "answer yes until the end
            of this question" (`rootCallId`) or "until the end of this session"
            (`session`).
          properties:
            rootCallId:
              type: string
              description: root tool call of the turn — stable for every command made within one question
            callId:
              type: string
              nullable: true
              description: the exact call that produced this command; handy for logs, not for caching decisions

    Result:
      type: object
      description: |
        Outcome of one command. `ok: false` is a normal answer, not a transport
        failure: the command may have failed to start, timed out, or been refused
        by the sandbox. Machine-readable detail goes into `results`, which the
        model reads like any other tool output.
      required: [ok]
      properties:
        ok: { type: boolean }
        code: { type: string, nullable: true, description: machine-readable error code }
        message: { type: string, nullable: true }
        results:
          type: array
          description: |
            Result blocks. The last one is usually a JSON object with `code`,
            `signal`, `cwd` and `sandbox` (see SandboxFacts).

            For `session.ping` the node declares `rttMs` in its reply but leaves
            it `null`: a node cannot know the server's clock, so it cannot time
            the round trip. The server fills the field in place (and adds
            `clockSkewMs`, the node clock offset), leaving the shape of the reply
            exactly what the node announced. No extra block, no extra fields on
            every other call.
          items:
            type: object
            properties:
              type: { type: string, enum: [text] }
              text: { type: string }
