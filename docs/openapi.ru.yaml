# Клиентский протокол dsh-nodes.
#
# Всё, что нужно новому клиенту (Android, Go, что угодно): регистрация узла,
# объявление своих API, присутствие, выдача команд и результаты.
#
# Чего здесь нет и не должно быть:
#  - админского API `/api/dsh-nodes/*` — оно приватное и ходит с сессией DSH;
#  - контракта плагинов узла (`bash`, `session`) — это внутреннее дело клиента,
#    сервер знает о методах только то, что клиент сам объявил в `announce`.
openapi: 3.1.0

info:
  title: dsh-nodes client API
  version: "1"
  description: |
    Протокол связи узла с сервером DSH.

    Три вещи, которые меняются в поведении и потому описаны подробно:

    **Команда выдаётся один раз.** `GET /v1/commands` берёт пачку с головы
    очереди и сразу переводит её в `processing`. Повторной выдачи нет: «взял —
    значит или исполнил, или пытался». Клиент, который упал, не увидит команду
    снова, а сервер закроет её как `lost` после таймаута.

    **Апрув — обычная команда.** Когда песочница отказала, сервер ставит на узел
    служебную команду `#INTERNAL.APPROVE` с большим сроком жизни. Модель при этом не ждёт:
    она уже получила отказ.

    **`approver: "local"` — обещание.** Узел, объявивший его, обязан
    поддерживать служебную команду `#INTERNAL.APPROVE`. Объявление сервер не проверяет:
    объявлении и иначе считает `approver: "none"`.

    **Поколение — это удостоверение.** Кто с кем говорит, решают два счётчика.
    `epoch` — поколение сервера: меняется на каждом его рестарте, и клиент,
    назвавший другое, получает отказ вместо команд из чужой жизни. `client_epoch`
    — поколение самого клиента: растёт на каждом соединении, поэтому старый
    экземпляр узла узнаётся даже после перезапуска сервера. Закрывает выданные
    команды только объявление `epoch: null` — «я потерял состояние»; сокет,
    который приходит и уходит, этого не делает никогда.

servers:
  - url: https://dsh.example.com/dsh-nodes
    description: префикс задаётся настройкой плагина

# Кадры websocket. Список совпадает с английской схемой: протокол один, а
# описаний два.
x-ws-frames:
  - state
  - ping
  - pong

# Соглашения, которых не видно из отдельного маршрута.
x-protocol-rules:
  websocket: >-
    только состояние. Клиент шлёт `{t:"state", epoch, client_epoch,
    max_commandno}` и `{t:"ping", no}`; сервер отвечает `{t:"state", epoch,
    max_commandno}` и `{t:"pong", no}`. Кадра рукопожатия нет: всё, что узел
    говорит о себе, едет в announce
  epoch: >-
    поколение сервера — удостоверение соединения. `epoch: null` в announce
    означает «я потерял состояние» и закрывает выданные команды узла кодом
    `node_restarted`; другое поколение в announce или в `commands` — `409
    epoch-mismatch`, на сокете — код `4409` с причиной `epoch`
  client-epoch: >-
    своё поколение клиента растёт на каждом соединении. Меньше известного —
    `409 client-epoch-stale` по HTTP и код `4001` с причиной `client-epoch` на
    сокете
  max-commandno-mismatch: >-
    заявление клиента о номере только пишется в журнал с обоими числами;
    реакция пока не решена
  websocket-close-codes:
    4001: replaced, или устаревшее поколение клиента (причина `client-epoch`)
    4400: кадр не из протокола
    4401: токен отозван или сокет замолчал
    4409: другое поколение сервера (причина `epoch`)

tags:
  - name: enroll
    description: как узел попадает на сервер
  - name: node
    description: присутствие, объявление API, выдача команд
  - name: presence
    description: WebSocket для дешёвых уведомлений

paths:
  /v1/enroll:
    post:
      tags: [enroll]
      summary: Заявка на подключение
      description: |
        Публичный маршрут. Клиент присылает свой `uuid` и `nonce`; `uuid` не
        секрет (лежит в конфиге, светится в логах), а токен по заявке получит
        только тот, кто знает `nonce`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uuid]
              properties:
                uuid:
                  type: string
                  minLength: 8
                  maxLength: 64
                name:
                  type: string
                  maxLength: 64
                  description: желаемое имя узла; по умолчанию `node-<8 символов uuid>`
                nonce:
                  type: string
                  maxLength: 200
                  description: секрет клиента; без него токен не выдадут
                clientVersion:
                  type: string
      responses:
        "202":
          description: заявка принята или уже была
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollStatus"
        "429":
          $ref: "#/components/responses/Error"

  /v1/enroll/{uuid}:
    get:
      tags: [enroll]
      summary: Состояние заявки
      description: |
        Пока заявка ждёт владельца — `202 pending`. После одобрения — `200` с
        токеном, **один раз**: повторная выдача только через админку.
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string }
        - name: nonce
          in: query
          required: false
          description: должен совпасть с тем, что прислан в заявке
          schema: { type: string }
      responses:
        "200":
          description: заявка одобрена, токен выдан сейчас и больше не будет
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrolled"
        "202":
          description: ждёт решения владельца
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollStatus"
        "403":
          description: заявка отклонена или nonce не совпал
        "404":
          description: заявки нет
        "409":
          description: токен уже выдан

  /v1/pair:
    post:
      tags: [enroll]
      summary: Обмен кода подключения на токен
      description: Публичный маршрут для сценария «владелец показал код, клиент его ввёл».
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: код из ссылки }
                name: { type: string, maxLength: 64 }
                aliases:
                  type: array
                  maxItems: 8
                  items: { type: string, maxLength: 64 }
                uuid: { type: string }
                clientVersion: { type: string }
      responses:
        "200":
          description: узел создан, токен выдан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrolled"
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: код уже использован }
        "410": { description: код истёк }

  /v1/announce:
    put:
      tags: [node]
      summary: Объявить свои API и политику
      security: [{ nodeToken: [] }]
      description: |
        Единственное место, где клиент рассказывает о себе: какие API держит, в
        каком режиме работает, умеет ли спрашивать человека и сколько уже живёт.

        Расхождение схем одного и того же API с другой версией не ошибка: сервер
        вернёт предупреждения, а версии останутся раздельными. Меняешь схему —
        поднимай версию, иначе узлы с разными схемами слипнутся.

        Здесь же клиент называет своё поколение, и это единственное заявление,
        которое закрывает выданные команды:

        | `epoch` | смысл | ответ |
        | --- | --- | --- |
        | текущее | клиент живёт в этом поколении сервера | 200 |
        | `null` (или нет поля) | клиент перезапустился и потерял состояние | 200, предварительно закрыв все `processing`-команды узла кодом `node_restarted` |
        | другое | клиент говорит из другой жизни сервера | `409 epoch-mismatch`, ничего не пишется |
        | `client_epoch` меньше известного | говорит старый экземпляр узла | `409 client-epoch-stale`, ничего не пишется |
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Announce"
      responses:
        "200":
          description: принято
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/QueueState"
                  - type: object
                    properties:
                      apis:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            name: { type: string }
                            version: { type: string, nullable: true }
                      warnings:
                        type: array
                        items: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "409":
          description: |
            `epoch-mismatch` — названо другое поколение сервера;
            `client-epoch-stale` — своё поколение клиента старше известного для
            этого узла. В обоих случаях не пишется ничего: клиент переподключается
            и объявляется с `epoch: null`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/state:
    get:
      tags: [node]
      summary: Состояние узла и очереди
      security: [{ nodeToken: [] }]
      responses:
        "200":
          description: состояние
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/QueueState"
                  - type: object
                    properties:
                      node: { type: integer }
                      online: { type: boolean }

  /v1/commands:
    get:
      tags: [node]
      summary: Взять команды на исполнение
      security: [{ nodeToken: [] }]
      description: |
        Берёт до `limit` команд **с головы** очереди среди `ready`, помечает их
        `processing` и возвращает. Взятое больше не выдаётся никогда — ни этому
        клиенту, ни другому.

        Если готовых команд нет, пачка пуста и `ready` равен нулю: клиент говорит
        «жду» кадром `state`, а не опросом.

        `epoch` и `client_epoch` едут параметрами запроса и проверяются так же,
        как в `announce`: другое поколение сервера — `409 epoch-mismatch`, своё
        поколение старше известного — `409 client-epoch-stale`; в обоих случаях
        команды не выдаются. Оба параметра необязательны: клиент, который их не
        называет, не проверяется — так продолжает работать старый клиент, он
        просто не может подтвердить, где стоит.

        `session.chdir` приходит этим же маршрутом, а служебные команды идут в
        зарезервированном пространстве имён (`api = -1`, имя с `#`):
        `#INTERNAL.CANCEL` (приоритет 10), `#INTERNAL.APPROVE` (приоритет 5) и
        барьер `#INTERNAL.FLUSH`.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 5, default: 5 }
        - name: epoch
          in: query
          required: false
          description: |
            Поколение сервера, в котором живёт клиент. Другое — `409
            epoch-mismatch`: клиент переподключается и объявляется с `epoch: null`.
          schema: { type: integer, nullable: true }
        - name: client_epoch
          in: query
          required: false
          description: |
            Своё поколение клиента, то же, что он назвал в `announce`. Меньше
            известного — `409 client-epoch-stale`: говорит старый экземпляр узла.
          schema: { type: integer, nullable: true }
        - name: max_commandno
          in: query
          required: false
          description: |
            Последний известный клиенту номер команды. Расхождение с номером
            сервера пока только пишется в журнал и ничего не меняет.
          schema: { type: integer, nullable: true }
      responses:
        "200":
          description: пачка команд
          content:
            application/json:
              schema:
                type: object
                properties:
                  commands:
                    type: array
                    items: { $ref: "#/components/schemas/Command" }
                  ready:
                    type: integer
                    description: сколько ещё ждёт выдачи
                  epoch: { type: integer }
                  max_commandno:
                    type: integer
                    description: последний израсходованный номер команды у этого узла
        "401": { $ref: "#/components/responses/Error" }
        "409":
          description: |
            `epoch-mismatch` или `client-epoch-stale`; команды не выдаются.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/commands/{seq}/result:
    post:
      tags: [node]
      summary: Отчитаться об исполнении
      security: [{ nodeToken: [] }]
      description: |
        Результат принимается и после того, как модель получила таймаут: команда
        живёт до `timeout`, а ответ на уже закрытую даёт `409` (это нормально,
        клиент его игнорирует).

        В `results` последним блоком клиент кладёт JSON с кодом возврата и
        отчётом песочницы — по нему сервер понимает, что это был отказ ядра.
      parameters:
        - name: seq
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Result"
      responses:
        "200":
          description: принято
        "404":
          description: такой команды нет
        "409":
          description: команда уже закрыта (поздний результат)

  /v1/ws:
    get:
      tags: [presence]
      summary: WebSocket присутствия
      description: |
        Апгрейд в WebSocket. Кадры — короткий JSON, трафик копеечный; данные
        команд всегда едут HTTP-ом, здесь только сигналы.

        Рукопожатия нет: клиент сначала объявляется по HTTP (там же решается
        вопрос поколения), а потом говорит `state`, когда начинает ждать.

        Клиент → сервер — ровно два кадра:

         - `{t:"state", epoch, client_epoch, max_commandno}` — «я жив и жду, живу
           в поколении `epoch`, моё собственное поколение `client_epoch`, и знаю
           команды по номер `max_commandno`». Один кадр — и присутствие, и флаг
           ожидания: сервер отвечает `{t:"state", ...}` **сразу**, если его номер
           уже больше, иначе молчит и помнит ожидание, чтобы ответить с появлением
           команды. У простаивающего узла с простаивающим сервером ходит одно
           число;
         - `{t:"ping", no}` — проверка живости; сервер возвращает тот же `no`.

        Сервер → клиент — ровно два кадра:

         - `{t:"state", epoch, max_commandno}` — «мой номер больше твоего, иди
           забирай»; клиент принимает номер, который назвал сервер, вместе с
           дырками. Кадр уходит только узлу, который объявил, что ждёт;
         - `{t:"pong", no}`.

        `max_commandno` в кадре — заявление, а не удостоверение: расхождение с
        номером сервера пишется в журнал с обоими числами и больше ничего не
        меняет.

        Поколения — это проверки, и неудачная проверка закрывает сокет: клиент
        переподключается с нуля с `epoch: null`, и только это заявление закрывает
        выданные команды.

        | кадр | условие | код закрытия | причина |
        | --- | --- | --- | --- |
        | `state` | `epoch` нет или он не текущий | `4409` | `epoch` |
        | `state` | `client_epoch` меньше известного для узла | `4001` | `client-epoch` |
        | любой | кадр не из протокола | `4400` | `unknown-frame` / `bad-json` / `no-t` |

        Прочие закрытия: `4001 replaced` — новый сокет занял место старого,
        `4401` — токен отозван, `4401 silent` — слишком много пропущенных
        пингов.

        Без сокета клиент продолжает работать: он забирает команды по HTTP и
        просто не узнаёт о новой работе мгновенно.
      responses:
        "101":
          description: соединение перешло в WebSocket

components:
  securitySchemes:
    nodeToken:
      type: http
      scheme: bearer
      description: токен узла, полученный при enroll или pair

  responses:
    Error:
      description: ошибка
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }

    EnrollStatus:
      type: object
      properties:
        status:
          type: string
          enum: [pending, approved, rejected, handed]
        uuid: { type: string }

    Enrolled:
      type: object
      properties:
        token: { type: string, description: токен узла; показывается один раз }
        node: { type: integer }
        alias: { type: string }
        aliases:
          type: array
          items: { type: string }

    MethodDef:
      type: object
      required: [method, args]
      properties:
        method: { type: string }
        args:
          type: object
          description: JSON-схема аргументов; по ней сервер проверяет `data`
        description: { type: string }

    ApiDef:
      type: object
      required: [name, version, methods]
      properties:
        id:
          type: integer
          description: номер API выдаёт сервер; придумывать его нельзя
        name: { type: string }
        version:
          type: string
          description: |
            Версия **контракта**, а не клиента. Меняется вместе со схемой любого
            метода; узлы с разными версиями одного имени остаются раздельными.
        methods:
          type: array
          items: { $ref: "#/components/schemas/MethodDef" }

    Announce:
      type: object
      required: [apis]
      properties:
        apis:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ApiDef" }
        applyRules:
          type: array
          description: |
            Привязки «метод этого узла → правило сервера». Поле отдельное и
            необязательное: правило говорит, как **эта машина** исполняет
            команду, а не каков контракт API, поэтому объявление, пришедшее из
            внешнего источника (MCP), не обязано нести служебные поля.

            Всё здесь сверяется с остальным объявлением: неизвестное правило,
            api, которого у узла нет, метод, которого api не объявляет, дубль
            привязки или неизвестная опция — отказ всему объявлению с
            `400 apply-rules-invalid`. Привязка, которая тихо ничего не делает,
            хуже отказа. Правило, которому нечего мерить (`timing` без
            `retNames`), принимается с предупреждением.
          items:
            type: object
            required: [api, method, rule]
            properties:
              api: { type: string, description: имя API из объявления }
              version:
                type: string
                description: |
                  Необязательное уточнение: привязать правило к одной версии
                  контракта. Без него правило действует на это имя API у этого
                  узла независимо от версии.
              method: { type: string }
              rule:
                type: string
                enum: [timing, flushBefore, flushAfter, flushAround]
                description: |
                  Набор правил фиксирован, контракты — в
                  `spec/SPECIAL-RULES.md`. Узел привязывает и о срабатывании не
                  узнаёт.
              rulesOpts:
                type: object
                additionalProperties: false
                properties:
                  retNames:
                    type: object
                    additionalProperties:
                      type: [string, "null"]
                    description: |
                      Для `timing`: канонное имя → поле в ответе узла, куда
                      положить число. `durationMs` сервер считает по своим
                      отметкам, узел для него не нужен; `clockSkewMs` требует
                      часов узла — они приходят полем `now` в конверте
                      результата. Канонное имя, которого нет в отображении (или
                      оно null), никуда не кладётся: мерить «в стол» можно,
                      придумывать имя поля за узла — нет.
        epoch:
          type: integer
          nullable: true
          description: |
            Поколение сервера, в котором живёт клиент, — из прошлого ответа.
            `null` — это заявление, а не пустое значение: клиент перезапустился и
            потерял состояние, поэтому все команды, которые узел якобы ещё
            исполняет, закрываются кодом `node_restarted`. Другое поколение —
            отказ `409 epoch-mismatch`, и тогда не пишется ничего.
        client_epoch:
          type: integer
          nullable: true
          description: |
            Своё поколение клиента: постоянный счётчик, который растёт на каждом
            соединении — и при переподключении, и при перезапуске. Хранится у
            узла и переживает рестарт сервера, поэтому старый экземпляр узла
            узнаётся по меньшему числу (`409 client-epoch-stale`) даже после
            перезапуска самого сервера.
        clientVersion: { type: string }
        platform:
          type: string
          maxLength: 32
          description: |
            На чём работает клиент: `desktop`, `android`. Хранится у узла и
            показывается в админке; версия клиента обычно несёт тот же префикс,
            но это поле — само утверждение. Поле косметическое: значение, которое
            после обрезки пробелов не строка длиной 1..32, игнорируется, а не
            отказывает всему объявлению; объявление без поля оставляет прежнее
            значение.
        access:
          type: string
          enum: [ro, rw, full]
          description: потолок прав на этой машине; выставляет владелец узла
        allowEscalation:
          type: boolean
          description: устаревшее поле, оставлено для старых клиентов
        approver:
          type: string
          enum: [local, server, none]
          description: |
            Кто отвечает на вопрос о повышении прав. `local` — человек за этой
            машиной, и это обещание поддержать `#INTERNAL.APPROVE`: команду не
            сервер объявление не примет и будет считать `none`.
        workdir: { type: string }
        uptimeSeconds:
          type: number
          description: |
            Сколько прошло с запуска процесса. Именно дельта, а не время старта:
            часы клиента могут врать, сервер считает аптайм по своим.

    QueueState:
      type: object
      properties:
        epoch:
          type: integer
          description: |
            Поколение сервера: меняется на каждом рестарте и служит удостоверением
            соединения. Клиент, назвавший старое, получает отказ (`409
            epoch-mismatch` по HTTP, код закрытия `4409` на сокете) и начинает
            заново с объявления `epoch: null`; назвавший текущее просто живёт в
            одной жизни с сервером.
        max_commandno:
          type: integer
          description: |
            Последний номер команды, выданный этому узлу с момента старта
            сервера. Номера честные: растут по одному на команду, не
            переиспользуются, и номер, потраченный на команду, которой узел так
            и не увидел (отмена, протухание), остаётся потраченным.

            Значит «я знаю до N» означает «всё новое будет ≥ N+1», и клиенту
            надо принимать номер, который назвал сервер, а не считать максимум по
            полученным командам: дырку в нумерации таким максимумом не догнать.
            Это не отметка доставки: команда с этим номером может уже исполняться.
        queued: { type: integer }
        ready: { type: integer }
        waiting: { type: integer, description: сколько моделей ждёт результата }

    SandboxFacts:
      type: object
      description: |
        Отчёт клиента о том, как прошло исполнение. `mode` — фактический режим,
        а не запрошенный: сервер верит этой цифре, а не своим ожиданиям.
      properties:
        mode:
          type: string
          enum: [ro, rw, full]
        enforcement:
          type: string
          enum: [none, bwrap]
        denied:
          type: boolean
          description: ядро отвергло часть работы (запись вне разрешённого)
        failed:
          type: boolean
          description: команда завершилась кодом не 0
        signature:
          type: string
          nullable: true
          description: сигнатура отказа, например `read-only file system`
        runnerFailure:
          type: boolean
          description: сломалась сама песочница, а не команда
        escalation:
          type: integer
          description: ступень эскалации, на которой выполнена команда

    Command:
      type: object
      required: [seq, api, method, timeout]
      properties:
        seq:
          type: integer
          description: номер команды; по нему отправляется результат
        api: { type: integer, description: номер API из справочника }
        method: { type: string }
        args: { type: object }
        timeout:
          type: integer
          description: секунды; по умолчанию 600
        sandbox:
          type: object
          properties:
            mode:
              type: string
              enum: [ro, rw, full]
            root: { type: string }
          description: запрошенный режим, вычисленный на стороне сервера из политики сессии
        approved:
          type: string
          description: |
            Идентификатор подтверждения. Ставит **только сервер**: если поле
            пришло от модели, клиент его игнорирует. Команда с `approved` не
            понижается стартовым режимом `base`, но всё равно ограничена `max`.
        escalation:
          type: integer
          description: 0 — обычный запуск, 1 — после первого подтверждения, 2 — после второго
        session:
          type: string
          description: сессия модели; по ней клиент заводит рабочий каталог

    Result:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        code: { type: string, nullable: true, description: машинный код ошибки }
        message: { type: string, nullable: true }
        now:
          type: number
          description: |
            Свои часы узла в момент ответа, миллисекунды с дробью. Поле есть в
            каждом результате — это простой факт об ответе, а не знание о
            правилах. Сервер читает его только тогда, когда просит правило:
            `timing` считает по нему `clockSkewMs`, больше никто на него не
            смотрит.
        results:
          type: array
          description: |
            Блоки результата. Последний блок, как правило, JSON с полями `code`,
            `signal`, `cwd` и `sandbox` (форма — `SandboxFacts` ниже; ссылкой она
            не привязана, потому что описывает содержимое текстового блока).

            Метод, привязанный к правилу `timing`, получает числа прямо в этот
            JSON — под именами, которые просила привязка в `retNames`. Узел в
            замере не участвует: `durationMs` считается по отметкам сервера, а
            `clockSkewMs` — по полю `now` этого конверта. Помешать узел может
            только одному: не прислать `now`, и тогда смещение не считается.
          items:
            type: object
            properties:
              type: { type: string, enum: [text] }
              text: { type: string }
